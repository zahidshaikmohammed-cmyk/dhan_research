name: UNPSYCHIC29 Gate 3 and Final Research
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Download Gate 2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input data output
          gh run download 33266330446 -n unpsychic29-gate2-research-v4 -D input
          test -s input/GATE2_session_metrics.parquet
          test -s input/UNPSYCHIC29_GATE2_ALL_500.csv
      - name: Download raw data
        run: |
          set -euo pipefail
          B=https://github.com/zahidshaikmohammed-cmyk/dhan_research/releases/download/chatgpt-full-data-33258430945
          curl -fL --retry 5 -o /tmp/a.zip $B/chatgpt-data-001.zip
          curl -fL --retry 5 -o /tmp/b.zip $B/chatgpt-data-002.zip
          unzip -q /tmp/a.zip -d data
          unzip -q /tmp/b.zip -d data
          test "$(find data -path '*/raw_1min/*.parquet' | wc -l)" -eq 500
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q pandas pyarrow duckdb numpy
      - name: Compute Gate 3 and final research
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd,numpy as np,duckdb,json
          out=Path('output');out.mkdir(exist_ok=True)
          g=pd.read_csv('input/UNPSYCHIC29_GATE2_ALL_500.csv')
          c=g[(g.range10_pct_median<=1.5109)&(g.eff10_median>=.45)&(g.late_directional_rate>=.32927)&(g.opening_flat_rate_005<=.06707)].symbol.tolist()
          assert len(c)>0
          con=duckdb.connect();con.execute('PRAGMA threads=4');rows=[]
          for p in sorted(Path('data').rglob('raw_1min/*.parquet')):
            sym=p.stem
            if sym not in c: continue
            f=str(p).replace("'","''")
            q=f"SELECT CAST(timestamp AS TIMESTAMP) ts,CAST(open AS DOUBLE)o,CAST(high AS DOUBLE)h,CAST(low AS DOUBLE)l,CAST(close AS DOUBLE)cl FROM read_parquet('{f}') WHERE CAST(timestamp AS TIME)>=TIME '09:25:00' AND CAST(timestamp AS TIME)<TIME '15:31:00' ORDER BY timestamp"
            d=con.execute(q).df();d['date']=d.ts.dt.date
            for dt,z in d.groupby('date'):
              z=z.reset_index(drop=True)
              if len(z)<300: continue
              p0=float(z.iloc[0].cl);ret60=100*(float(z.iloc[59].cl)/p0-1);ret120=100*(float(z.iloc[119].cl)/p0-1);ret300=100*(float(z.iloc[299].cl)/p0-1);retclose=100*(float(z.iloc[-1].cl)/p0-1)
              yy=np.log(z.cl.iloc[:60].to_numpy());xx=np.arange(60);coef=np.polyfit(xx,yy,1);fit=np.polyval(coef,xx);r2=1-np.sum((yy-fit)**2)/max(np.sum((yy-yy.mean())**2),1e-12)
              path=100*np.abs(np.diff(z.cl.iloc[:60].to_numpy()/z.cl.iloc[:60].shift(1).to_numpy())).sum();eff=abs(ret60)/path if path else 0
              dr=1 if ret60>0 else -1 if ret60<0 else 0;mfe=100*((z.h.iloc[:60].max()/p0-1) if dr>0 else (1-z.l.iloc[:60].min()/p0) if dr<0 else 0);mae=100*((1-z.l.iloc[:60].min()/p0) if dr>0 else (z.h.iloc[:60].max()/p0-1) if dr<0 else 0)
              rows.append({'symbol':sym,'trade_date':dt,'ret60':ret60,'ret120':ret120,'ret300':ret300,'retclose':retclose,'r2':r2,'eff':eff,'mfe':mfe,'mae':mae})
          s=pd.DataFrame(rows);assert not s.empty;s.to_parquet(out/'GATE3_SESSION_METRICS.parquet',index=False)
          a=s.groupby('symbol').agg(sessions=('trade_date','count'),ret60=('ret60','median'),r2=('r2','median'),eff=('eff','median'),cont_close=('retclose',lambda x:0),mfe=('mfe','median'),mae=('mae','median')).reset_index()
          cont=s.groupby('symbol').apply(lambda x:((x.ret60*x.retclose)>0).mean());cont120=s.groupby('symbol').apply(lambda x:((x.ret60*x.ret120)>0).mean());move=s.groupby('symbol').apply(lambda x:(x.ret60.abs()>=.50).mean());a=a.set_index('symbol');a['cont_close']=cont;a['cont120']=cont120;a['move_rate']=move;a['mfe_mae']=a.mfe/(a.mae+1e-9);a=a.reset_index()
          dates=np.array(sorted(pd.to_datetime(s.trade_date).unique()));blocks=np.array_split(dates,4);bd=[]
          for i,b in enumerate(blocks,1):
            z=s[pd.to_datetime(s.trade_date).isin(b)]
            for sym,x in z.groupby('symbol'): bd.append({'symbol':sym,'block':i,'ret':x.ret60.median(),'r2':x.r2.median(),'eff':x.eff.median(),'cont':((x.ret60*x.retclose)>0).mean(),'move':(x.ret60.abs()>=.50).mean(),'mae':x.mae.median()})
          bd=pd.DataFrame(bd);parts=[]
          for i,x in bd.groupby('block'):
            x=x.copy()
            for col,pos in [('ret',1),('r2',1),('eff',1),('cont',1),('move',1),('mae',0)]:
              med=x[col].median();x[col+'_pass']=x[col]>=med if pos else x[col]<=med
            x['pass']=x[[c for c in x if c.endswith('_pass')]].all(axis=1);parts.append(x)
          bd=pd.concat(parts);w=bd.pivot(index='symbol',columns='block',values='pass').fillna(False);w.columns=[f'block_{x}' for x in w.columns];w=w.reset_index();w['blocks_passed']=w[[x for x in w if x.startswith('block_')]].sum(axis=1);a=a.merge(w,on='symbol')
          for col in ['r2','eff','cont_close','cont120','move_rate','mfe_mae']: a[col+'_p']=a[col].rank(pct=True)
          a['mae_p']=1-a.mae.rank(pct=True);a['stability']=a.blocks_passed/4;a['gate3_score']=a[['r2_p','eff_p','cont_close_p','cont120_p','move_rate_p','mfe_mae_p','mae_p']].mean(axis=1)*a.stability;a=a.sort_values(['gate3_score','blocks_passed','mfe_mae','r2'],ascending=False).reset_index(drop=True);a.insert(0,'gate3_rank',np.arange(1,len(a)+1));a.to_csv(out/'GATE3_ALL.csv',index=False);bd.to_csv(out/'GATE3_BLOCK_DETAIL.csv',index=False)
          final=a[a.blocks_passed>=3].head(29);final.to_csv(out/'UNPSYCHIC29_FINAL.csv',index=False)
          report={'gate2_candidates':len(c),'gate3_candidates':len(a),'stable_ge3':int((a.blocks_passed>=3).sum()),'final_count':len(final),'method':'Gate 3 uses 60/120/300 minute continuation, regression R2, path efficiency, continuation, meaningful-move rate, MFE/MAE and four chronological stability blocks.'};Path(out/'UNPSYCHIC29_FINAL_REPORT.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2));print(final[['gate3_rank','symbol','blocks_passed','r2','eff','cont_close','cont120','mfe_mae']].to_string(index=False))
          PY
      - name: Validate
        run: |
          python - <<'PY'
          import pandas as pd,json
          x=pd.read_csv('output/UNPSYCHIC29_FINAL.csv');r=json.load(open('output/UNPSYCHIC29_FINAL_REPORT.json'))
          assert len(x)==29 and x.symbol.nunique()==29 and r['final_count']==29
          print('UNPSYCHIC29 VALIDATED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: unpsychic29-gate3-final
          path: output/
          retention-days: 90
