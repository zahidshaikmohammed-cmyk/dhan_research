name: UNPSYCHIC29 Method 7 Composite
on: push
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data output; B=https://github.com/zahidshaikmohammed-cmyk/dhan_research/releases/download/chatgpt-full-data-33258430945; curl -fL "$B/chatgpt-data-001.zip" -o /tmp/a.zip; curl -fL "$B/chatgpt-data-002.zip" -o /tmp/b.zip; unzip -q /tmp/a.zip -d data; unzip -q /tmp/b.zip -d data
      - run: python -m pip install -q pandas numpy duckdb pyarrow
      - run: python research/unpsychic29_deep_research_fast.py
      - run: |
          python - <<'PY'
          import pandas as pd,json
          from pathlib import Path
          o=Path('output'); e=pd.read_parquet(o/'ENTRY_EVENT_DATA.parquet'); rows=[]
          for (s,en),g in e.groupby(['symbol','entry']):
            for side in ['LONG','SHORT']:
              d=(g.mom_10>0)&(g.eff_10>=.5)&(g.r2_20>=.5)&(g.relvol_5_20>=1) if side=='LONG' else (g.mom_10<0)&(g.eff_10>=.5)&(g.r2_20>=.5)&(g.relvol_5_20>=1)
              y=(g.loc[d,'fwd_60'] if side=='LONG' else -g.loc[d,'fwd_60']).dropna()
              if len(y)>=15: rows.append({'symbol':s,'entry':en,'side':side,'n':len(y),'win':(y>0).mean(),'mean':y.mean(),'median':y.median()})
          r=pd.DataFrame(rows)
          if r.empty: raise SystemExit('NO_COMPOSITE_RULES')
          r['score']=r.win*r.median; r.sort_values('score',ascending=False).to_csv(o/'METHOD7_COMPOSITE.csv',index=False); (o/'METHOD7_STATUS.json').write_text(json.dumps({'status':'PASS','candidates':len(r)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: UNPSYCHIC29-METHOD-7, path: output/}