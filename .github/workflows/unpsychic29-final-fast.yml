name: UNPSYCHIC29 FINAL FAST
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Download Gate 2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input data output
          gh run download 33266330446 -n unpsychic29-gate2-research-v4 -D input
          test -s input/UNPSYCHIC29_GATE2_ALL_500.csv
      - name: Extract raw data for Gate 2 candidates
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, os, zipfile, urllib.request
          from pathlib import Path
          rows=list(csv.DictReader(open('input/UNPSYCHIC29_GATE2_ALL_500.csv',newline='')))
          def ok(r):
              try:
                  return float(r['range10_pct_median'])<=1.5109 and float(r['eff10_median'])>=0.45 and float(r['late_directional_rate'])>=0.32927 and float(r['opening_flat_rate_005'])<=0.06707
              except Exception: return False
          candidates=[r['symbol'].strip() for r in rows if ok(r)]
          assert len(candidates)>=29, f'Only {len(candidates)} Gate-2 candidates; cannot produce a 29-name universe.'
          wanted=set(candidates)
          base='https://github.com/zahidshaikmohammed-cmyk/dhan_research/releases/download/chatgpt-full-data-33258430945'
          for i in (1,2):
              zpath=f'/tmp/data-{i:03d}.zip'
              urllib.request.urlretrieve(f'{base}/chatgpt-data-{i:03d}.zip',zpath)
              with zipfile.ZipFile(zpath) as z:
                  names=z.namelist()
                  hits=0
                  for n in names:
                      bn=Path(n).name
                      # Accept both parquet chunk CSV naming and normal parquet naming.
                      match=any(bn.startswith(f'raw_1min__{s}.parquet.chunk') and bn.endswith('.csv') for s in wanted)
                      if match:
                          z.extract(n,'data'); hits+=1
                  print(f'archive {i}: extracted {hits} matching raw chunks')
              os.remove(zpath)
          got={p.name.split('__',1)[1].split('.parquet.chunk',1)[0] for p in Path('data').rglob('raw_1min__*.parquet.chunk*.csv')}
          missing=sorted(wanted-got)
          assert not missing, f'Missing raw chunks for Gate-2 candidates: {missing}'
          Path('output/GATE2_CANDIDATES.txt').write_text('\n'.join(candidates)+'\n')
          print(f'Gate2 candidates={len(candidates)}; all raw chunks present')
          PY
      - name: Install research engine
        run: python -m pip install --disable-pip-version-check -q pandas duckdb numpy pyarrow
      - name: Compute independent Gate 3 score and exact 29
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, numpy as np, pandas as pd, duckdb
          out=Path('output'); files=sorted(Path('data').rglob('raw_1min__*.parquet.chunk*.csv')); assert files
          rows=[]
          for sym in sorted({p.name.split('__',1)[1].split('.parquet.chunk',1)[0] for p in files}):
              fs=[str(p).replace("'","''") for p in files if p.name.startswith(f'raw_1min__{sym}.parquet.chunk')]
              arr=','.join("'"+x+"'" for x in fs); con=duckdb.connect(); con.execute('PRAGMA threads=4')
              q=f"SELECT CAST(timestamp AS TIMESTAMPTZ) AT TIME ZONE 'Asia/Kolkata' ts,CAST(open AS DOUBLE)o,CAST(high AS DOUBLE)h,CAST(low AS DOUBLE)l,CAST(close AS DOUBLE)c FROM read_csv_auto([{arr}],header=true,union_by_name=true,ignore_errors=true) WHERE CAST(CAST(timestamp AS TIMESTAMPTZ) AT TIME ZONE 'Asia/Kolkata' AS TIME)>=TIME '09:25:00' AND CAST(CAST(timestamp AS TIMESTAMPTZ) AT TIME ZONE 'Asia/Kolkata' AS TIME)<TIME '15:31:00' ORDER BY ts"
              d=con.execute(q).df(); con.close(); d['date']=d.ts.dt.date
              for dt,z in d.groupby('date',sort=True):
                  z=z.reset_index(drop=True)
                  if len(z)<300: continue
                  c=z.c.to_numpy(float); h=z.h.to_numpy(float); l=z.l.to_numpy(float); p=c[0]
                  r60=100*(c[59]/p-1); r120=100*(c[119]/p-1); r300=100*(c[299]/p-1); rc=100*(c[-1]/p-1)
                  ret=100*np.diff(c)/c[:-1]; path=float(np.abs(ret[:60]).sum()); eff=abs(r60)/path if path else 0
                  yy=np.log(c[:60]); xx=np.arange(60); fit=np.polyval(np.polyfit(xx,yy,1),xx); r2=float(1-np.sum((yy-fit)**2)/max(np.sum((yy-yy.mean())**2),1e-12))
                  direction=np.sign(r60); mfe=float(100*(h[:60].max()/p-1)) if direction>0 else float(100*(1-l[:60].min()/p)) if direction<0 else 0
                  mae=float(100*(1-l[:60].min()/p)) if direction>0 else float(100*(h[:60].max()/p-1)) if direction<0 else 0
                  rows.append(dict(symbol=sym,trade_date=dt,ret60=r60,ret120=r120,ret300=r300,retclose=rc,eff=eff,r2=r2,mfe=mfe,mae=mae))
          s=pd.DataFrame(rows); assert not s.empty
          g=s.groupby('symbol')
          a=g.agg(sessions=('trade_date','count'),ret60=('ret60','median'),ret120=('ret120','median'),ret300=('ret300','median'),retclose=('retclose','median'),eff=('eff','median'),r2=('r2','median'),mfe=('mfe','median'),mae=('mae','median')).reset_index()
          a['cont120'] = g.apply(lambda x: float((x.ret60*x.ret120>0).mean())).values
          a['cont300'] = g.apply(lambda x: float((x.ret60*x.ret300>0).mean())).values
          a['contclose'] = g.apply(lambda x: float((x.ret60*x.retclose>0).mean())).values
          a['move50'] = g.apply(lambda x: float((x.ret60.abs()>=.50).mean())).values
          a['move35_120'] = g.apply(lambda x: float((x.ret120.abs()>=.35).mean())).values
          a['mfe_mae'] = a.mfe/(a.mae.abs()+1e-9)
          # Deterministic cross-sectional score. It does not force a behavioral pass/fail;
          # it ranks the fixed Gate-2 universe and takes exactly 29, with every component exposed.
          components=['cont120','cont300','contclose','move50','move35_120','eff','r2','mfe_mae']
          for col in components: a[col+'_pct']=a[col].rank(pct=True)
          a['score']=(a[[c+'_pct' for c in components]].mean(axis=1))
          a=a.sort_values(['score','contclose','cont120','mfe_mae','r2'],ascending=False).reset_index(drop=True)
          a.insert(0,'rank',np.arange(1,len(a)+1)); final=a.head(29).copy()
          assert len(final)==29 and final.symbol.nunique()==29
          s.to_parquet(out/'GATE3_SESSION_METRICS.parquet',index=False); a.to_csv(out/'GATE3_ALL_RANKED.csv',index=False); final.to_csv(out/'UNPSYCHIC29_FINAL.csv',index=False)
          report={'gate2_candidates':int(a.symbol.nunique()),'gate3_sessions':int(len(s)),'final_count':int(len(final)),'final_exact_29':True,'selection':'Deterministic rank over the fixed Gate-2 universe using median continuation at 120/300/close, meaningful 60m and 120m movement rates, path efficiency, regression R2, and MFE/MAE. No post-hoc manual names.','warning':'This is a research-ranked 29, not a guarantee of future returns or a live trading signal.'}
          (out/'UNPSYCHIC29_FINAL_REPORT.json').write_text(json.dumps(report,indent=2,default=str)); print(json.dumps(report,indent=2)); print(final[['rank','symbol','score','cont120','cont300','contclose','move50','move35_120','eff','r2','mfe_mae']].to_string(index=False))
          PY
      - name: Final validation
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd, json
          x=pd.read_csv('output/UNPSYCHIC29_FINAL.csv'); r=json.load(open('output/UNPSYCHIC29_FINAL_REPORT.json'))
          assert len(x)==29 and x.symbol.nunique()==29 and r['final_count']==29 and r['final_exact_29']
          assert list(x['rank'])==list(range(1,30))
          print('UNPSYCHIC29 FINAL VALIDATION PASSED: EXACTLY 29 UNIQUE NAMES')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: UNPSYCHIC29-FINAL-VALIDATED
          path: output/
          retention-days: 90
