name: UNPSYCHIC29 Gate 2 Temporal Stability Research
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download Gate 2 session artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input
          gh run download 33266330446 -n unpsychic29-gate2-research-v4 -D input
          test -f input/GATE2_session_metrics.parquet
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q pandas pyarrow numpy
      - name: Compute four-block stability
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd,numpy as np,json
          out=Path('output');out.mkdir(exist_ok=True)
          s=pd.read_parquet('input/GATE2_session_metrics.parquet');s['trade_date']=pd.to_datetime(s.trade_date)
          dates=np.array(sorted(s.trade_date.unique())); cuts=np.array_split(dates,4); labels={d:i+1 for i,b in enumerate(cuts) for d in b};s['block']=s.trade_date.map(labels)
          def agg(x):
            g=x.groupby('symbol');d=g.agg(valid_sessions=('trade_date','count'),range10=('range10_pct','median'),eff10=('eff10','median'),flat=('ret10_pct',lambda z:(z.abs()<.05).mean()),continuation=('continuation_same_direction','mean'))
            d['late_dir']=g.apply(lambda z:((z.ret25_30_pct.abs()>=.10)&(z.eff10>=.50)).mean());return d.reset_index()
          block=agg(s);block.to_csv(out/'GATE2_BLOCK_METRICS.csv',index=False)
          records=[]
          for b in range(1,5):
            d=block[block.block==b].copy()
            for c in ['range10','eff10','late_dir','flat']:
              med=d[c].median();mad=(d[c]-med).abs().median();d[c+'_median']=med;d[c+'_mad']=mad
              if c=='range10':d[c+'_pass']=d[c]<=med
              elif c=='flat':d[c+'_pass']=d[c]<=med
              else:d[c+'_pass']=d[c]>=med
            d['all_four_pass']=d[['range10_pass','eff10_pass','late_dir_pass','flat_pass']].all(axis=1)
            d['block']=b;records.append(d)
          bm=pd.concat(records,ignore_index=True);bm.to_csv(out/'GATE2_BLOCK_PASS_DETAIL.csv',index=False)
          wide=bm.pivot(index='symbol',columns='block',values='all_four_pass').fillna(False);wide.columns=[f'block_{c}_pass' for c in wide.columns];wide=wide.reset_index();wide['blocks_passed']=wide.filter(like='_pass').sum(axis=1)
          # Cross-block consistency metrics.
          summary=bm.groupby('symbol').agg(blocks=('block','count'),median_range10=('range10','median'),median_eff10=('eff10','median'),median_late_dir=('late_dir','median'),median_flat=('flat','median'),range10_iqr=('range10',lambda x:x.quantile(.75)-x.quantile(.25)),eff10_iqr=('eff10',lambda x:x.quantile(.75)-x.quantile(.25)),late_dir_iqr=('late_dir',lambda x:x.quantile(.75)-x.quantile(.25))).reset_index()
          summary=summary.merge(wide,on='symbol');summary['pass_fraction']=summary.blocks_passed/4
          summary.to_csv(out/'GATE2_STABILITY_500.csv',index=False)
          stable=summary[summary.blocks_passed==4].copy().sort_values(['median_late_dir','median_eff10'],ascending=False);stable.to_csv(out/'GATE2_STABLE_ALL4.csv',index=False)
          stable3=summary[summary.blocks_passed>=3].copy().sort_values(['blocks_passed','median_late_dir','median_eff10'],ascending=False);stable3.to_csv(out/'GATE2_STABLE_GE3.csv',index=False)
          report={'blocks':[(str(b[0]),str(b[-1]),len(b)) for b in cuts],'all4_count':int(len(stable)),'ge3_count':int(len(stable3)),'median_blocks_passed':float(summary.blocks_passed.median()),'max_blocks_passed':int(summary.blocks_passed.max()),'method':'Each chronological block is independently benchmarked against its own cross-sectional median; Gate 2 stability is persistence of the desired behavioral regime, not a fixed percentile or target stock count.'}
          Path(out/'GATE2_STABILITY_REPORT.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2));print(stable[['symbol','blocks_passed','median_range10','median_eff10','median_late_dir','median_flat']].head(100).to_string(index=False))
          PY
      - name: Upload Gate 2 stability research
        uses: actions/upload-artifact@v4
        with:
          name: unpsychic29-gate2-stability-research
          path: output/
          retention-days: 30
