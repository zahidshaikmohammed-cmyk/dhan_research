name: Full ChatGPT Research Export

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CHATGPT_CHUNK_BYTES: "41943040"
  RELEASE_ASSET_TARGET_BYTES: "450000000"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
          persist-credentials: true

      - name: Pull and verify all LFS parts
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull
          parts=( *.zip.part001 *.zip.part002 *.zip.part003 )
          for p in "${parts[@]}"; do test -f "$p"; done
          sha256sum "${parts[@]}" > lfs-parts.sha256

      - name: Reassemble and validate archive
        shell: bash
        run: |
          set -euo pipefail
          p1=$(find . -maxdepth 1 -type f -name '*.zip.part001' -print -quit)
          p2=$(find . -maxdepth 1 -type f -name '*.zip.part002' -print -quit)
          p3=$(find . -maxdepth 1 -type f -name '*.zip.part003' -print -quit)
          cat "$p1" "$p2" "$p3" > research-reconstructed.zip
          unzip -t research-reconstructed.zip

      - name: Extract research archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted export_work
          mkdir -p extracted export_work
          unzip -q research-reconstructed.zip -d extracted
          find extracted -type f -print0 | sort -z | xargs -0 -r sha256sum > export_work/extracted-sha256.txt

      - name: Install conversion dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input pyarrow
          python3 -c 'import pyarrow; print(pyarrow.__version__)'

      - name: Stream every Parquet file into ChatGPT-readable CSV chunks
        shell: bash
        env:
          CHUNK_BYTES: ${{ env.CHATGPT_CHUNK_BYTES }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv
          import hashlib
          import json
          import os
          import pyarrow.parquet as pq

          ROOT = Path('extracted')
          OUT = Path('export_work/csv')
          OUT.mkdir(parents=True, exist_ok=True)
          LIMIT = int(os.environ['CHUNK_BYTES'])
          manifest = []
          total_rows = 0
          total_sources = 0

          parquet_files = sorted(ROOT.rglob('*.parquet'))
          if not parquet_files:
              raise SystemExit('No Parquet files found in extracted research archive.')

          for src in parquet_files:
              pf = pq.ParquetFile(src)
              schema = pf.schema_arrow
              columns = schema.names
              h = hashlib.sha256()
              with src.open('rb') as sf:
                  for block in iter(lambda: sf.read(8 * 1024 * 1024), b''):
                      h.update(block)
              source_sha = h.hexdigest()
              source_rows = pf.metadata.num_rows
              total_sources += 1
              total_rows += source_rows

              safe = src.relative_to(ROOT).as_posix().replace('/', '__')
              chunk_no = 0
              rows_in_source = 0
              current = None
              fh = None
              writer = None

              def open_chunk(n):
                  path = OUT / f'{safe}.chunk{n:05d}.csv'
                  f = path.open('w', encoding='utf-8', newline='')
                  w = csv.writer(f, lineterminator='\n')
                  w.writerow(columns)
                  f.flush()
                  return path, f, w

              def close_chunk(path, f, rows):
                  if f is None:
                      return
                  f.flush(); f.close()
                  if rows:
                      print(f'WROTE {path} rows={rows} bytes={path.stat().st_size:,}')
                  else:
                      path.unlink(missing_ok=True)

              rows_in_chunk = 0
              for batch in pf.iter_batches(batch_size=25000, use_threads=True):
                  records = batch.to_pylist()
                  for rec in records:
                      if current is None:
                          current, fh, writer = open_chunk(chunk_no)
                          chunk_no += 1
                          rows_in_chunk = 0
                      writer.writerow([rec.get(c) for c in columns])
                      rows_in_chunk += 1
                      rows_in_source += 1
                      fh.flush()
                      if fh.tell() >= LIMIT:
                          close_chunk(current, fh, rows_in_chunk)
                          current = fh = writer = None
                          rows_in_chunk = 0

              close_chunk(current, fh, rows_in_chunk if current else 0)
              if rows_in_source != source_rows:
                  raise SystemExit(f'ROW COUNT MISMATCH: {src}: expected {source_rows}, converted {rows_in_source}')

              manifest.append({
                  'source': src.relative_to(ROOT).as_posix(),
                  'sha256': source_sha,
                  'rows': source_rows,
                  'columns': columns,
                  'chunks': chunk_no,
                  'schema': str(schema),
              })

          (Path('export_work') / 'PARQUET_MANIFEST.json').write_text(
              json.dumps({'files': manifest, 'total_files': total_sources, 'total_rows': total_rows}, indent=2, default=str),
              encoding='utf-8')
          print(f'TOTAL PARQUET FILES: {total_sources}')
          print(f'TOTAL ROWS: {total_rows:,}')
          PY

      - name: Build release assets under ChatGPT upload limits
        shell: bash
        env:
          TARGET: ${{ env.RELEASE_ASSET_TARGET_BYTES }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="chatgpt-full-data-${GITHUB_RUN_ID}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release create "$TAG" --title "ChatGPT Full Research Data $GITHUB_RUN_ID" --notes "Complete Parquet-to-CSV export of the research dataset. CSV chunks are contiguous and row-count validated. Release assets are kept below the 512 MB ChatGPT per-file upload limit." --prerelease --target main

          python3 - <<'PY'
          from pathlib import Path
          import os, zipfile, subprocess

          target = int(os.environ['TARGET'])
          csvs = sorted(Path('export_work/csv').glob('*.csv'))
          if not csvs:
              raise SystemExit('No CSV chunks were produced.')

          batch = 1
          zpath, zf = None, None

          def open_zip(n):
              path = Path(f'export_work/chatgpt-data-{n:03d}.zip')
              return path, zipfile.ZipFile(path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6)

          def upload(path):
              print(f'UPLOADING {path} ({path.stat().st_size:,} bytes)')
              subprocess.run(['gh','release','upload',os.environ['TAG'],str(path)], check=True)
              path.unlink(missing_ok=True)

          zpath, zf = open_zip(batch)
          for src in csvs:
              zf.write(src, arcname=src.name)
              src.unlink()
              zf.fp.flush()
              if zpath.stat().st_size >= target:
                  zf.close()
                  upload(zpath)
                  batch += 1
                  zpath, zf = open_zip(batch)

          zf.close()
          if zpath.stat().st_size:
              upload(zpath)
          else:
              zpath.unlink(missing_ok=True)

          subprocess.run(['gh','release','upload',os.environ['TAG'],'export_work/PARQUET_MANIFEST.json','lfs-parts.sha256'], check=True)
          PY

      - name: Final integrity check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[] | [.name,.size] | @tsv'
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -ge 2
