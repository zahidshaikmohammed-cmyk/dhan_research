name: UNPSYCHIC29 Deep Trading-System Research Fast V2
on:
  push:
    branches: [main]
    paths:
      - research/unpsychic29_deep_research_fast.py
      - .github/workflows/unpsychic29-deep-research-fast-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Download exact research release
        shell: bash
        run: |
          set -euo pipefail
          B=https://github.com/zahidshaikmohammed-cmyk/dhan_research/releases/download/chatgpt-full-data-33258430945
          mkdir -p data output
          curl -fL --retry 5 --retry-delay 3 -o /tmp/a.zip "$B/chatgpt-data-001.zip"
          curl -fL --retry 5 --retry-delay 3 -o /tmp/b.zip "$B/chatgpt-data-002.zip"
          unzip -q /tmp/a.zip -d data
          unzip -q /tmp/b.zip -d data
      - name: Install research stack
        run: python -m pip install --disable-pip-version-check -q pandas numpy duckdb pyarrow
      - name: Run optimized deep research
        run: python research/unpsychic29_deep_research_fast.py
      - name: Validate research outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          out=Path('output')
          cov=pd.read_csv(out/'DATA_COVERAGE_29.csv')
          locked={'360ONE','MPHASIS','HCLTECH','POLYMED','JSL','AFFLE','SONACOMS','VEDL','NATIONALUM','JKCEMENT','ZENSARTECH','KEI','TATATECH','LTM','PVRINOX','UNOMINDA','ENDURANCE','RAINBOW','SHREECEM','APTUS','MOTILALOFS','ESCORTS','NATCOPHARM','SPLPETRO','PERSISTENT','TRAVELFOOD','UBL','INDIACEM','BHARTIHEXA'}
          assert set(cov.symbol)==locked
          assert len(cov)==29
          for f in ['ENTRY_EVENT_DATA.parquet','ENTRY_TIME_FEATURE_SWEEP.csv','SIGNAL_DISCOVERY_CANDIDATES.csv','TOP_SIGNAL_CANDIDATES.csv','STOCK_PERSONALITIES_29.csv','CHRONOLOGICAL_STABILITY_4BLOCKS.csv','DEEP_RESEARCH_SUMMARY.json']:
              assert (out/f).exists() and (out/f).stat().st_size>0, f
          print('UNPSYCHIC29 FAST V2 INTEGRITY VALIDATION PASSED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: UNPSYCHIC29-DEEP-RESEARCH-FAST-V2
          path: output/
          retention-days: 90
