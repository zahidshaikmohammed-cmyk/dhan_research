name: UNPSYCHIC29 Method 4 Regime
on: push
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data output; B=https://github.com/zahidshaikmohammed-cmyk/dhan_research/releases/download/chatgpt-full-data-33258430945; curl -fL "$B/chatgpt-data-001.zip" -o /tmp/a.zip; curl -fL "$B/chatgpt-data-002.zip" -o /tmp/b.zip; unzip -q /tmp/a.zip -d data; unzip -q /tmp/b.zip -d data
      - run: python -m pip install -q pandas numpy duckdb pyarrow
      - run: python research/unpsychic29_deep_research_fast.py
      - run: |
          python - <<'PY'
          import pandas as pd,json
          from pathlib import Path
          o=Path('output'); e=pd.read_parquet(o/'ENTRY_EVENT_DATA.parquet'); rows=[]
          for (s,en),g in e.groupby(['symbol','entry']):
            for regime,m in [('TREND',g.r2_20>=.7),('FLAT',g.r2_20<.7),('VOL',g.relvol_5_20>=1.5),('CALM',g.relvol_5_20<1.5)]:
              for side in ['LONG','SHORT']:
                y=(g.loc[m,'fwd_60'] if side=='LONG' else -g.loc[m,'fwd_60']).dropna()
                if len(y)>=20: rows.append({'symbol':s,'entry':en,'regime':regime,'side':side,'n':len(y),'win':(y>0).mean(),'mean':y.mean(),'median':y.median()})
          r=pd.DataFrame(rows)
          if r.empty: raise SystemExit('NO_REGIMES')
          r['score']=r.win*r.median; r.sort_values('score',ascending=False).to_csv(o/'METHOD4_REGIME.csv',index=False); (o/'METHOD4_STATUS.json').write_text(json.dumps({'status':'PASS','candidates':len(r)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: UNPSYCHIC29-METHOD-4, path: output/}