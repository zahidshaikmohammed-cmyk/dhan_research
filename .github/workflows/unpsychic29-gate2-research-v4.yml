name: UNPSYCHIC29 Gate 2 Empirical Research V4
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate2:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Download complete export
        shell: bash
        run: |
          set -euo pipefail
          TAG=chatgpt-full-data-33258430945
          BASE=https://github.com/zahidshaikmohammed-cmyk/dhan_research/releases/download/$TAG
          mkdir -p input data output
          curl -fL --retry 5 --retry-delay 2 -o input/001.zip $BASE/chatgpt-data-001.zip
          curl -fL --retry 5 --retry-delay 2 -o input/002.zip $BASE/chatgpt-data-002.zip
          unzip -q input/001.zip -d data
          unzip -q input/002.zip -d data
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q pandas duckdb numpy pyarrow
      - name: Compute Gate 2 over all raw 1-minute sessions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import duckdb,pandas as pd,numpy as np,json
          root=Path('data'); out=Path('output'); out.mkdir(exist_ok=True)
          files=sorted(root.rglob('raw_1min__*.parquet.chunk*.csv'))
          assert len(files)==500,f'Expected 500 raw CSV files, found {len(files)}'
          con=duckdb.connect(); con.execute('PRAGMA threads=4')
          paths=','.join("'"+str(p).replace("'","''")+"'" for p in files)
          src=f"read_csv_auto([{paths}],header=true,union_by_name=true)"
          desc=con.execute(f'DESCRIBE SELECT * FROM {src} LIMIT 1').fetchall(); cols=[x[0] for x in desc]
          assert {'symbol','timestamp','open','high','low','close'}.issubset(cols),cols
          q=f"""
          WITH base AS (
            SELECT symbol,
              CAST(timestamp AS TIMESTAMPTZ) AT TIME ZONE 'Asia/Kolkata' AS ts,
              CAST(open AS DOUBLE) o,CAST(high AS DOUBLE) h,CAST(low AS DOUBLE) l,CAST(close AS DOUBLE) c
            FROM {src}
          ), b AS (
            SELECT *,CAST(ts AS DATE) trade_date,LAG(c) OVER(PARTITION BY symbol,CAST(ts AS DATE) ORDER BY ts) prev_c,
              ROW_NUMBER() OVER(PARTITION BY symbol,CAST(ts AS DATE) ORDER BY ts) rn
            FROM base
            WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:31:00'
          ), s AS (
            SELECT symbol,trade_date,
              COUNT(*) n_total,
              COUNT(*) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:20:00') n5,
              COUNT(*) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:25:00') n10,
              COUNT(*) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:30:00') n15,
              COUNT(*) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:20:00' AND CAST(ts AS TIME)<TIME '09:25:00') n20_25,
              COUNT(*) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:25:00' AND CAST(ts AS TIME)<TIME '09:30:00') n25_30,
              FIRST(o ORDER BY ts) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:16:00') first_open,
              FIRST(c ORDER BY ts DESC) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:20:00') c20,
              FIRST(c ORDER BY ts DESC) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:20:00' AND CAST(ts AS TIME)<TIME '09:25:00') c25,
              FIRST(c ORDER BY ts DESC) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:25:00' AND CAST(ts AS TIME)<TIME '09:30:00') c30,
              FIRST(c ORDER BY ts DESC) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:30:00' AND CAST(ts AS TIME)<TIME '09:31:00') c31,
              MAX(h) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:20:00') hi5,MIN(l) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:20:00') lo5,
              MAX(h) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:25:00') hi10,MIN(l) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:25:00') lo10,
              MAX(h) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:30:00') hi15,MIN(l) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:30:00') lo15,
              SUM(ABS(c/NULLIF(prev_c,0)-1)) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:20:00') path5,
              SUM(ABS(c/NULLIF(prev_c,0)-1)) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:25:00') path10,
              SUM(ABS(c/NULLIF(prev_c,0)-1)) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:30:00') path15,
              SUM(CASE WHEN c>o THEN 1 WHEN c<o THEN -1 ELSE 0 END) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:20:00') signed5,
              SUM(CASE WHEN c>o THEN 1 WHEN c<o THEN -1 ELSE 0 END) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:25:00') signed10,
              SUM(CASE WHEN c>o THEN 1 WHEN c<o THEN -1 ELSE 0 END) FILTER(WHERE CAST(ts AS TIME)>=TIME '09:15:00' AND CAST(ts AS TIME)<TIME '09:30:00') signed15
            FROM b GROUP BY symbol,trade_date
          ), r AS (
            SELECT *,100*(hi5-lo5)/NULLIF(first_open,0) range5_pct,100*(hi10-lo10)/NULLIF(first_open,0) range10_pct,100*(hi15-lo15)/NULLIF(first_open,0) range15_pct,
              100*(c20/NULLIF(first_open,0)-1) ret5_pct,100*(c25/NULLIF(first_open,0)-1) ret10_pct,100*(c30/NULLIF(first_open,0)-1) ret15_pct,
              100*(c25/NULLIF(c20,0)-1) ret20_25_pct,100*(c30/NULLIF(c25,0)-1) ret25_30_pct,100*(c31/NULLIF(c30,0)-1) ret30_31_pct,
              100*path5 path5_pct,100*path10 path10_pct,100*path15 path15_pct
            FROM s WHERE n5=5 AND n10=10 AND n15=15 AND n20_25=5 AND n25_30=5
          )
          SELECT *,ABS(ret5_pct)/NULLIF(path5_pct,0) eff5,ABS(ret10_pct)/NULLIF(path10_pct,0) eff10,ABS(ret15_pct)/NULLIF(path15_pct,0) eff15,
            CASE WHEN ret10_pct*ret25_30_pct>0 THEN 1 ELSE 0 END continuation_same_direction,
            CASE WHEN ABS(ret25_30_pct)>=0.05 THEN 1 ELSE 0 END move25_30_ge_005,
            CASE WHEN ABS(ret25_30_pct)>=0.10 THEN 1 ELSE 0 END move25_30_ge_010,
            CASE WHEN ABS(ret25_30_pct)>=0.15 THEN 1 ELSE 0 END move25_30_ge_015,
            CASE WHEN ABS(ret25_30_pct)>=0.25 THEN 1 ELSE 0 END move25_30_ge_025
          FROM r
          """
          sess=con.execute(q).df(); assert sess.symbol.nunique()==500,f'Only {sess.symbol.nunique()} symbols in valid session set'
          sess.to_parquet(out/'GATE2_session_metrics.parquet',index=False)
          metrics=['range5_pct','range10_pct','range15_pct','ret5_pct','ret10_pct','ret15_pct','ret20_25_pct','ret25_30_pct','path5_pct','path10_pct','path15_pct','eff5','eff10','eff15','signed5','signed10','signed15']
          agg={}
          for c in metrics: agg[c+'_median']=(c,'median');agg[c+'_p25']=(c,lambda x:x.quantile(.25));agg[c+'_p75']=(c,lambda x:x.quantile(.75));agg[c+'_p90']=(c,lambda x:x.quantile(.90));agg[c+'_p95']=(c,lambda x:x.quantile(.95))
          stock=sess.groupby('symbol').agg(valid_sessions=('trade_date','count'),**agg).reset_index()
          for t in ['005','010','015','025']: stock['late_move_ge_'+t+'_rate']=sess.groupby('symbol')['move25_30_ge_'+t].mean().reindex(stock.symbol).to_numpy()
          sm={'continuation_rate':sess.groupby('symbol').continuation_same_direction.mean(),'opening_flat_rate_005':sess.groupby('symbol').apply(lambda g:(g.ret10_pct.abs()<.05).mean(),include_groups=False),'opening_chaos_rate_eff30':sess.groupby('symbol').apply(lambda g:(g.eff10<.30).mean(),include_groups=False),'opening_chaos_rate_eff50':sess.groupby('symbol').apply(lambda g:(g.eff10<.50).mean(),include_groups=False),'late_directional_rate':sess.groupby('symbol').apply(lambda g:((g.ret25_30_pct.abs()>=.10)&(g.eff10>=.50)).mean(),include_groups=False),'late_same_direction_rate':sess.groupby('symbol').apply(lambda g:((g.ret10_pct*g.ret25_30_pct)>0).mean(),include_groups=False)}
          for k,v in sm.items(): stock[k]=v.reindex(stock.symbol).to_numpy()
          stock.to_csv(out/'UNPSYCHIC29_GATE2_ALL_500.csv',index=False)
          qrows=[]
          for c in ['range5_pct_median','range10_pct_median','range15_pct_median','path10_pct_median','eff10_median','continuation_rate','late_move_ge_005_rate','late_move_ge_010_rate','late_move_ge_015_rate','late_move_ge_025_rate','late_directional_rate','opening_flat_rate_005','opening_chaos_rate_eff30','opening_chaos_rate_eff50']:
            for qv in [.05,.10,.25,.50,.75,.90,.95]: qrows.append({'metric':c,'quantile':qv,'value':float(stock[c].quantile(qv))})
          pd.DataFrame(qrows).to_csv(out/'GATE2_population_quantiles.csv',index=False)
          inv=sess.groupby('symbol').agg(valid_sessions=('trade_date','count'),date_min=('trade_date','min'),date_max=('trade_date','max')).reset_index();inv.to_csv(out/'GATE2_inventory.csv',index=False)
          checks={'raw_csv_files':len(files),'symbols':int(sess.symbol.nunique()),'valid_session_rows':int(len(sess)),'date_min':str(sess.trade_date.min()),'date_max':str(sess.trade_date.max()),'median_sessions_per_stock':float(stock.valid_sessions.median()),'min_sessions_per_stock':int(stock.valid_sessions.min()),'max_sessions_per_stock':int(stock.valid_sessions.max()),'stocks_ge_200_sessions':int((stock.valid_sessions>=200).sum()),'stocks_ge_230_sessions':int((stock.valid_sessions>=230).sum()),'expected_bars_per_valid_session':15,'timestamp_normalization':'CAST(timestamp AS TIMESTAMPTZ) AT TIME ZONE Asia/Kolkata','method_note':'Descriptive Gate 2 population research. No arbitrary percentile or target survivor count.'}
          Path(out/'GATE2_integrity.json').write_text(json.dumps(checks,indent=2));print(json.dumps(checks,indent=2));print(stock.sort_values(['late_directional_rate','continuation_rate'],ascending=False)[['symbol','valid_sessions','range10_pct_median','eff10_median','continuation_rate','late_move_ge_010_rate','late_directional_rate','opening_chaos_rate_eff50']].head(50).to_string(index=False))
          PY
      - name: Upload Gate 2 research results
        uses: actions/upload-artifact@v4
        with:
          name: unpsychic29-gate2-research-v4
          path: output/
          retention-days: 30
