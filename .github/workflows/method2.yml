name: UNPSYCHIC29 Method 2 ZScore
on: push
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data output; B=https://github.com/zahidshaikmohammed-cmyk/dhan_research/releases/download/chatgpt-full-data-33258430945
          curl -fL "$B/chatgpt-data-001.zip" -o /tmp/a.zip; curl -fL "$B/chatgpt-data-002.zip" -o /tmp/b.zip; unzip -q /tmp/a.zip -d data; unzip -q /tmp/b.zip -d data
      - run: python -m pip install -q pandas numpy duckdb pyarrow
      - run: python research/unpsychic29_deep_research_fast.py
      - run: |
          python - <<'PY'
          import pandas as pd,numpy as np,json
          from pathlib import Path
          o=Path('output'); e=pd.read_parquet(o/'ENTRY_EVENT_DATA.parquet'); e.trade_date=pd.to_datetime(e.trade_date); rows=[]
          fs=['mom_3','mom_5','mom_10','mom_15','eff_5','eff_10','r2_10','r2_20','slope_10','relvol_5_20','dist_vwap_pct']
          for (s,en),g in e.groupby(['symbol','entry']):
            for f in fs:
              mu,sd=g[f].mean(),g[f].std()
              if not np.isfinite(sd) or sd==0: continue
              z=(g[f]-mu)/sd
              for side in ['LONG','SHORT']:
                for cut in [1,1.5,2]:
                  m=(z>=cut) if side=='LONG' else (z<=-cut); y=(g.loc[m,'fwd_60'] if side=='LONG' else -g.loc[m,'fwd_60']).dropna()
                  if len(y)>=20: rows.append({'symbol':s,'entry':en,'feature':f,'cut':cut,'side':side,'n':len(y),'win':(y>0).mean(),'mean':y.mean(),'median':y.median()})
          r=pd.DataFrame(rows)
          if r.empty: raise SystemExit('NO_CANDIDATES')
          r['score']=r.win*r.median; r.sort_values('score',ascending=False).to_csv(o/'METHOD2_ZSCORE.csv',index=False); (o/'METHOD2_STATUS.json').write_text(json.dumps({'status':'PASS','candidates':len(r)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: UNPSYCHIC29-METHOD-2, path: output/}